<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<meta name="theme-color" content="#0E1316">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>看一眼</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="pager">

  <!-- 左邊一頁：騎車。點「騎車」重抓 Strava，點右上的 FTP 數字改 FTP -->
  <section class="page">
    <div class="stage ride-page">
      <div class="week-head">
        <button class="week-title" id="ride-refresh" type="button" aria-label="重新同步 Strava">騎車<span class="spinner" aria-hidden="true"></span></button>
        <div class="week-note"><span class="stale"></span><span class="ride-note" id="ride-note"></span><button class="ftp-btn" id="ftp-btn" type="button" aria-label="修改 FTP">FTP <span class="mono" id="ftp-value">–</span></button></div>
      </div>
      <div class="ride-body">
        <div class="ride-left">
          <div class="ride-stats">
            <div class="stat">
              <div class="stat-label">狀態 TSB</div>
              <div class="stat-row"><span class="stat-value mono" id="tsb">--</span><span class="pill" id="form-pill" hidden></span></div>
            </div>
            <div class="stat">
              <div class="stat-label"><i class="swatch swatch-ctl"></i>體能 CTL</div>
              <div class="stat-row"><span class="stat-value mono" id="ctl">--</span><span class="stat-sub mono" id="ramp"></span></div>
            </div>
            <div class="stat">
              <div class="stat-label"><i class="swatch swatch-atl"></i>疲勞 ATL</div>
              <div class="stat-row"><span class="stat-value mono" id="atl">--</span></div>
            </div>
          </div>
          <div class="ride-chart" id="pmc" role="img" aria-label="最近 90 天的體能、疲勞與狀態"></div>
        </div>
        <div class="ride-right">
          <div class="ride-block-head">
            <span class="block-title">功率曲線</span>
            <span class="legend"><i class="swatch swatch-ctl"></i>近 6 週<i class="swatch swatch-year"></i>一年</span>
          </div>
          <div class="ride-chart" id="curve" role="img" aria-label="各時間長度的最大平均功率"></div>
          <div class="ride-block-head">
            <span class="block-title">心率漂移</span>
            <span class="legend">1 小時以上，5% 以內＝有氧底子夠</span>
          </div>
          <div class="drift" id="drift"></div>
        </div>
      </div>
      <div class="ride-foot">Garmin 裝置記錄 · Powered by Strava</div>
    </div>
  </section>

  <!-- 中間（常駐、一打開就在這頁）：設計稿 A2 -->
  <section class="page">
    <div class="stage now-page">
      <div class="main">
        <div class="head">
          <div class="now">
            <div class="meta"><span class="clock"></span><span class="stale"></span></div>
            <div class="headline" id="headline">&nbsp;</div>
            <div class="summary" id="summary">&nbsp;</div>
          </div>
          <button class="utci" id="utci-open" type="button" aria-label="看今天每小時的 UTCI" aria-haspopup="dialog">
            <span class="utci-label">UTCI</span>
            <span class="utci-value mono" id="utci-value">--</span>
            <span class="pill" id="utci-pill" hidden></span>
          </button>
        </div>
        <div class="chart">
          <div class="bars" id="bars"></div>
          <div class="ticks" id="ticks"></div>
        </div>
      </div>
      <aside class="side" id="side">
        <div class="block">
          <div class="block-title">未交作業</div>
          <button class="hw" id="hw" type="button" aria-label="重新同步作業">
            <span class="hw-item"><span class="ring ring-today mono"><span class="ring-num" id="hw-today">–</span></span><span>今天</span></span>
            <span class="hw-item"><span class="ring ring-soon mono"><span class="ring-num" id="hw-soon">–</span></span><span>三天內</span></span>
          </button>
        </div>
        <div class="block">
          <div class="block-title">今天</div>
          <div class="events" id="cal-today"></div>
        </div>
        <div class="block">
          <div class="block-title">明天</div>
          <div class="events" id="cal-tomorrow"></div>
        </div>
      </aside>

      <!-- 點 UTCI 跳出：今天每小時的 UTCI 折線圖 -->
      <div class="sheet" id="utci-sheet" hidden>
        <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="utci-sheet-title">
          <div class="sheet-head">
            <div>
              <div class="sheet-title" id="utci-sheet-title">今天每小時 UTCI</div>
              <div class="sheet-sub" id="utci-sheet-sub"></div>
            </div>
            <div class="sheet-readout" id="utci-readout"></div>
            <button class="sheet-close" id="utci-close" type="button" aria-label="關閉">×</button>
          </div>
          <svg class="utci-chart" id="utci-chart" role="img" aria-label="今天每小時 UTCI 折線圖"></svg>
          <div class="sheet-legend">
            <span><i class="swatch u0"></i>無熱壓力 &lt;26</span>
            <span><i class="swatch u1"></i>中度熱壓力 26–31</span>
            <span><i class="swatch u2"></i>強熱壓力 32–37</span>
            <span><i class="swatch u3"></i>非常強熱壓力 ≥38</span>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- 右邊一頁：未來一週，設計稿 W1 -->
  <section class="page">
    <div class="stage week-page">
      <div class="week-head">
        <button class="week-title" id="week-refresh" type="button" aria-label="重新抓取天氣">未來一週<span class="spinner" aria-hidden="true"></span></button>
        <div class="week-note"><span class="stale"></span>淡的那幾天＝4 天後，參考就好</div>
      </div>
      <div class="week-row week-hours">
        <div class="day-label"></div>
        <div class="cells" id="week-hours"></div>
        <div class="day-utci week-utci-head">UTCI</div>
      </div>
      <div class="week-rows" id="week-rows"></div>
    </div>
  </section>

</main>

<!-- 主畫面 App 跟瀏覽器的儲存空間是分開的（iPhone），所以要能在 App 裡直接輸入金鑰 -->
<form class="key-form" id="key-form" hidden>
  <label class="key-title" for="key-input">輸入看板金鑰</label>
  <p class="key-hint">這支手機第一次打開、或金鑰換過時才需要。貼上金鑰或整串網址都可以。</p>
  <div class="key-row">
    <input id="key-input" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" required>
    <button type="button" id="key-paste" hidden>貼上</button>
    <button type="submit" class="key-save">儲存</button>
  </div>
  <p class="key-error" id="key-error"></p>
</form>
<form class="key-form" id="ftp-form" hidden>
  <label class="key-title" for="ftp-input">FTP（瓦）</label>
  <p class="key-hint">從今天起的騎乘用這個 FTP 算負荷，之前的照舊用當時的。</p>
  <div class="key-row">
    <input id="ftp-input" type="number" inputmode="numeric" min="50" max="600" step="1" autocomplete="off" required>
    <button type="button" id="ftp-cancel">取消</button>
    <button type="submit" class="key-save">儲存</button>
  </div>
  <p class="key-error" id="ftp-error"></p>
</form>
<script src="app.js"></script>
</body>
</html>
